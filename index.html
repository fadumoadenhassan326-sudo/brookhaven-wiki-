<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBcJML9DofYIAspkXPbCtvahCeK4CTizk",
  authDomain: "brookhavenwikiroblo.firebaseapp.com",
  projectId: "brookhavenwikiroblo",
  storageBucket: "brookhavenwikiroblo.firebasestorage.app",
  messagingSenderId: "908194720730",
  appId: "1:908194720730:web:809099bed5577e466daee3",
  measurementId: "G-Q2Z5W1B83"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();

function loginWithGoogle() {
  auth.signInWithPopup(provider)
    .catch(error => {
      console.error("Google login error:", error);

      // Fallback til redirect
      auth.signInWithRedirect(provider);
    });
}

function logoutGoogle() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  const loginButton = document.getElementById("googleLoginBtn");
  const userInfo = document.getElementById("googleUserInfo");
  const logoutButton = document.getElementById("googleLogoutBtn");

  if (user) {
    if (loginButton) loginButton.style.display = "none";

    if (userInfo) {
      userInfo.style.display = "block";
      userInfo.innerHTML =
        "👋 Hej " + (user.displayName || "Bruger");
    }

    if (logoutButton) logoutButton.style.display = "inline-block";
  } else {
    if (loginButton) loginButton.style.display = "inline-block";
    if (userInfo) userInfo.style.display = "none";
    if (logoutButton) logoutButton.style.display = "none";
  }
});
</script>

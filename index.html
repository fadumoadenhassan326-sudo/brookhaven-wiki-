  <!-- PRISON LANDMARK -->
  <section class="teaser">
    <h2>🚔 Prison Landmark</h2>
    <p>COMING SOON</p>

    <div class="timer">
      ⏳ <span id="prisonTimer">15:00</span>
    </div>
  </section>

  <!-- BANK UPDATE -->
  <section class="admin-card">
    <h3>🏦 Bank Update</h3>
    <p>Bank Update er allerede ude.</p>
  </section>

  <!-- WEBSITE REMAKE -->
  <section class="teaser">
    <h2>🛠️ WEBSITE REMAKE</h2>
    <p>COMING SOON</p>
  </section>

</section>

<script>
let left = 15 * 60;

const timer = setInterval(() => {
  let minutes = Math.floor(left / 60);
  let seconds = left % 60;

  document.getElementById("prisonTimer").textContent =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");

  if (left <= 0) {
    clearInterval(timer);
  }

  left--;
}, 1000);
</script>
